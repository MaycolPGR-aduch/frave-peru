name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Syntax check
        run: |
          git ls-files '*.php' | xargs -n1 -P4 php -l > /dev/null

      - name: Install coding standards
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: WordPress coding standards and PHP compatibility
        run: vendor/bin/phpcs

  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: node --check
        run: |
          git ls-files '*.js' | xargs -n1 node --check
